name: CI & Cross-Validation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    name: TypeScript, Golden Cross-Validation & Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck engine & web packages
        run: |
          npx tsc -p packages/engine/tsconfig.json --noEmit
          npx tsc -p apps/web/tsconfig.json --noEmit

      - name: Run Vitest unit & cross-validation benchmark suite
        run: pnpm test

      - name: Build production web bundle
        run: pnpm run build

  python-backend-tests:
    name: FastAPI OCR, RP Solver & MILP Weekly Optimizer Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/py-backend/requirements.txt

      - name: Install Python dependencies
        run: pip install -r services/py-backend/requirements.txt

      - name: Run pytest suite
        env:
          PYTHONPATH: services/py-backend
        run: pytest services/py-backend/test_main.py -v

